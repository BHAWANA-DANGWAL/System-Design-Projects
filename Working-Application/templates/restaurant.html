{% extends "base.html" %}{% block title %}{{ restaurant.name }}{% endblock %}{% block content %}<a href="{{ url_for('index') }}">← All restaurants</a><p class="eyebrow">{{ restaurant.cuisine }}</p><h1>{{ restaurant.name }}</h1><div class="panel">{% for item in restaurant.items %}<div class="item"><div><h3>{{ item.name }}</h3><b>₹{{ item.price }}</b></div><form method="post" action="{{ url_for('add_to_cart',item_id=item.id) }}"><button class="btn">Add +</button></form></div>{% endfor %}</div>{% endblock %}
